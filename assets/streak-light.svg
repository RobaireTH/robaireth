<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc"><title id="title">3,963 contributions, 7 Nov 2025 – 6 Nov 2026. Current streak: 12 days, 25 Oct 2026 – 5 Nov 2026. Longest streak: 36 days, 1 Apr 2026 – 6 May 2026. Ring: 33% of longest streak.</title><desc id="desc">Consecutive contribution days from the full GitHub history. The ring compares the current streak with the personal record. A zero-contribution current day does not break a streak until the day ends. Dates use UTC.</desc><rect width="720" height="250" fill="#ffffff"/><circle cx="360" cy="76" r="43" fill="none" stroke="#d1d9e0" stroke-width="3"/><circle cx="360" cy="76" r="43" fill="none" stroke="#b03e56" stroke-width="3" stroke-linecap="round" stroke-dasharray="90.059 270.177" transform="rotate(-90 360 76)"/><text x="360" y="82" text-anchor="middle" fill="#b03e56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="600">12</text><text x="360" y="99" text-anchor="middle" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="400">days</text><path d="M240 39V190M480 39V190" stroke="#d1d9e0"/><text x="120" y="86" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="600">3,963</text><text x="600" y="86" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="600">36</text><text x="600" y="105" text-anchor="middle" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="400">days</text><text x="120" y="140" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="400">Contributions · past 12 months</text><text x="360" y="140" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="400">Current streak</text><text x="600" y="140" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="400">Longest streak · all time</text><text x="120" y="163" text-anchor="middle" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="400">7 Nov 2025 – 6 Nov 2026</text><text x="360" y="163" text-anchor="middle" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="400">25 Oct 2026 – 5 Nov 2026</text><text x="600" y="163" text-anchor="middle" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="400">1 Apr 2026 – 6 May 2026</text><text x="360" y="185" text-anchor="middle" fill="#b03e56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="400">33% of personal best</text><text x="360.0" y="228" text-anchor="middle" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" font-weight="400">Updated 6 Nov 2026, 07:18 UTC · refreshes hourly</text></svg>